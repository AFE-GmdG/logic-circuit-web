<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Logic Circuit Web</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script type="module" crossorigin src="/src/index.tsx"></script>
    <style>
      :root {
        --color-bg-base: hsl(220, 18%, 10%);
        --color-bg-surface: hsl(220, 18%, 14%);
        --color-bg-elevated: hsl(220, 18%, 18%);
        --color-border-subtle: hsl(220, 16%, 22%);
        --color-border-strong: hsl(220, 16%, 32%);

        --color-text-primary: #f0f4f8;
        --color-text-secondary: hsl(220, 12%, 75%);
        --color-text-muted: hsl(220, 12%, 52%);

        /* Logic & Circuit Colors */
        --color-logic-low: hsl(140, 20%, 35%);
        --color-logic-high: hsl(125, 95%, 55%);
        --color-logic-high-glow: hsla(125, 95%, 55%, 0.4);
        --color-logic-undefined: hsl(200, 80%, 55%);
        --color-logic-error: hsl(0, 85%, 60%);

        --color-wire-default: hsl(220, 15%, 45%);
        --color-wire-selected: hsl(45, 100%, 55%);
        --color-grid-dots: hsl(220, 15%, 22%);
        --color-grid-canvas: hsl(220, 18%, 12%);

        /* Component Accents */
        --color-accent-primary: hsl(210, 100%, 60%);
        --color-accent-primary-hover: hsl(210, 100%, 68%);
        --color-accent-primary-bg: hsl(210, 80%, 18%);
        --color-selection-fill: hsla(210, 100%, 60%, 0.15);
        --color-ai-highlight: hsl(172, 75%, 52%);
        --color-library-accent: hsl(32, 95%, 58%);
        --color-library-accent-hover: hsl(32, 95%, 66%);
        --color-library-bg: rgba(245, 158, 11, 0.14);
        --color-library-border: rgba(245, 158, 11, 0.55);

        --color-status-running: hsl(135, 80%, 50%);
        --color-status-stopped: hsl(0, 75%, 55%);

        /* Button & Toggle Colors */
        --color-button-toggle-off: #384038;
        --color-button-toggle-off-border: #222b22;
        --color-button-toggle-on: #02fd02;
        --color-button-toggle-on-border: #00aa00;
        --color-button-toggle-on-glow: #02fd02;

        /* Semantic UI Surfaces, Borders & Contrast Text */
        --color-text-on-accent: #0b111a;
        --color-text-on-strong: #ffffff;
        --color-surface-hover: rgba(255, 255, 255, 0.08);
        --color-surface-subtle: rgba(255, 255, 255, 0.02);
        --color-tooltip-error-bg: rgba(33, 38, 45, 0.96);

        --color-accent-tint-subtle: rgba(56, 139, 253, 0.08);
        --color-accent-tint: rgba(56, 139, 253, 0.15);
        --color-accent-tint-strong: rgba(56, 139, 253, 0.24);
        --color-accent-highlight: rgba(56, 139, 253, 0.32);

        --color-info-bg: rgba(34, 211, 238, 0.1);
        --color-info-border: rgba(34, 211, 238, 0.3);
        --color-candidate-fill: rgba(56, 189, 248, 0.22);
        --color-ai-highlight-fill: rgba(45, 212, 191, 0.08);

        --color-success-bg: rgba(46, 160, 67, 0.15);
        --color-success-bg-strong: rgba(46, 160, 67, 0.25);
        --color-success-border: rgba(34, 197, 94, 0.35);

        --color-warning: #facc15;
        --color-warning-bg: rgba(250, 204, 21, 0.12);
        --color-warning-bg-strong: rgba(250, 204, 21, 0.24);
        --color-warning-border: rgba(250, 204, 21, 0.38);

        --color-error-text: #ffa198;
        --color-error-text-soft: #ffd6d6;
        --color-error-bg: hsla(0, 85%, 60%, 0.14);
        --color-error-border: rgba(239, 68, 68, 0.35);

        --font-family-base: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        --font-family-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      }

      html {
        background-color: var(--color-bg-base);
        color: var(--color-text-primary);
        font-family: var(--font-family-base);

        user-select: none;
      }

      body {
        margin: 0;
        padding: 0;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
      }

      #root {
        display: flex;
        flex-direction: column;
        align-items: stretch;
        justify-content: flex-start;

        width: 100vw;
        height: 100vh;
        margin: 0;
        padding: 0;

        user-select: none;
      }

      /* Schlanke Scrollbalken */
      ::-webkit-scrollbar {
        width: 0.5rem;
        height: 0.5rem;
      }
      ::-webkit-scrollbar-track {
        background: var(--color-bg-base);
      }
      ::-webkit-scrollbar-thumb {
        background: var(--color-border-strong);
        border-radius: 0.25rem;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: var(--color-text-muted);
      }
      * {
        scrollbar-width: thin;
        scrollbar-color: var(--color-border-strong) var(--color-bg-base);
        box-sizing: border-box;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
